name: Publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Bump version if the current package version already exists on npm
        id: bump
        shell: bash
        run: |
          PACKAGE_NAME=$(node -e "console.log(require('./package.json').name)")
          CURRENT_VERSION=$(node -e "console.log(require('./package.json').version)")

          if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version >/dev/null 2>&1; then
            npm version patch --no-git-tag-version
            echo "version_bumped=true" >> "$GITHUB_OUTPUT"
            NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
            echo "Current version already exists on npm. Bumped package version to $NEW_VERSION"
          else
            echo "version_bumped=false" >> "$GITHUB_OUTPUT"
            echo "Current version does not exist on npm, publishing as-is."
          fi

      - name: Commit version bump if needed
        if: steps.bump.outputs.version_bumped == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump package version"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
